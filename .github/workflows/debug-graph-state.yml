name: Debug graph state

on:
  workflow_dispatch: {}
  push:
    branches: [debug/graph-state]

jobs:
  repro:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install the three packages the graph actually needs
        run: |
          python -m pip install -q --upgrade pip
          python -m pip install -q \
            langgraph==1.2.8 \
            langgraph-checkpoint==4.1.1 \
            langgraph-checkpoint-sqlite==3.1.0

      - name: Run reproduction
        run: python -m tests.debug_graph_state
