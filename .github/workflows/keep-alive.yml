name: Keep Streamlit app awake

on:
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping app
        # No -f: Streamlit's sleeping-app interstitial can send curl into a
        # redirect loop (exit 47). We only need to generate traffic so the
        # app stays warm — not care about the final HTTP code.
        run: |
          curl -sSL --max-redirs 5 --max-time 90 \
            -A "GitHub-Actions-Keepalive" \
            -o /dev/null \
            -w "HTTP %{http_code} · %{num_redirects} redirect(s) · %{time_total}s\n" \
            https://goldbot-raj.streamlit.app/ || true
          echo "Ping attempt completed at $(date -u)"
